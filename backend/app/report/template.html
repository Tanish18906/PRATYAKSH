<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 920px; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; line-height: 1.5; }
  h1 { font-size: 1.6rem; margin-bottom: .2rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; border-bottom: 1px solid #d0d7de; padding-bottom: .2rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { border: 1px solid #d0d7de; padding: .35rem .5rem; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; }
  .badge { display: inline-block; background: #fff3cd; border: 1px solid #e0c36a; padding: .1rem .5rem; border-radius: 4px; font-size: .8rem; font-weight: 600; }
  .note { background: #f6f8fa; border-left: 4px solid #8c959f; padding: .5rem .8rem; margin: .8rem 0; }
  .muted { color: #57606a; font-size: .9rem; }
  li { margin: .2rem 0; }
</style>
</head>
<body>
$body
</body>
</html>
